<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--ink:#18302f;--muted:#657775;--paper:#f5f2ea;--card:#fffefa;--line:#dce2dc;--teal:#17766f;--teal2:#dcefeb;--coral:#d86955}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.shell{width:min(100%,680px);overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:0 14px 42px #173d3320}.head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 14px;background:linear-gradient(120deg,#173d38,#235f57);color:#fff}.eyebrow{margin:0 0 4px;color:#a9d9cf;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1,h2,p{margin:0}h1{font-size:21px;letter-spacing:-.03em}.live{font-size:11px;padding:6px 9px;border:1px solid #ffffff38;border-radius:99px}.controls{display:flex;gap:6px;overflow:auto;padding:12px 14px;border-bottom:1px solid var(--line);background:#ffffff80}button{white-space:nowrap;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:11px;font-weight:700;cursor:pointer}button.active{border-color:var(--teal);background:var(--teal);color:#fff}button:disabled{opacity:.55;cursor:wait}.body{padding:18px 20px 20px}.loading{text-align:center;padding:52px 12px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}.spend,.side{border:1px solid var(--line);border-radius:16px;background:var(--card)}.spend{padding:16px}.label,.meta,.status{color:var(--muted);font-size:11px}.amount{display:block;margin:4px 0;font-size:34px;letter-spacing:-.05em}.flow{display:flex;gap:14px;margin-top:13px;font-size:12px}.flow strong{display:block;font-size:15px}.side{display:grid;grid-template-columns:1fr 1fr}.metric{padding:14px}.metric+.metric{border-left:1px solid var(--line)}.metric strong{display:block;margin-top:5px;font-size:17px}.warning{color:var(--coral)}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}h2{font-size:13px}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.category{padding:10px 11px;text-align:left}.category-top{display:flex;justify-content:space-between;gap:8px}.bar{height:4px;margin-top:8px;background:#e6e9e5;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal);border-radius:inherit}.txs{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--card)}.tx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--teal2)}.copy{min-width:0;flex:1}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}.sum{font-size:12px;font-weight:750}.positive{color:var(--teal)}.empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}.status{min-height:16px;margin-top:9px}@media(max-width:500px){.hero{grid-template-columns:1fr}.category-grid{grid-template-columns:1fr}.body{padding:15px}.amount{font-size:30px}}@media(prefers-color-scheme:dark){:root{--ink:#e7f0ed;--muted:#9fb1ac;--paper:#15201e;--card:#1d2b28;--line:#ffffff18;--teal:#58b9aa;--teal2:#29453f}.controls{background:#172421}.head{background:#102a26}}
</style></head><body><main class="shell"><header class="head"><div><p class="eyebrow">Money Keeper · Live</p><h1>Monthly money movement</h1></div><span class="live">read-only</span></header><div class="controls" id="periods"><button data-period="current_month">This month</button><button data-period="previous_month">Last month</button><button data-period="last_3_months">3 months</button></div><div class="controls" id="accounts"></div><div class="body"><div id="loading" class="loading">Loading your statement data…</div><div id="content" hidden><section class="hero"><article class="spend"><span id="period" class="label"></span><strong id="spent" class="amount"></strong><p class="meta">Spent, excluding detected internal transfers</p><div class="flow"><span>Income<strong id="income"></strong></span><span>Net cashflow<strong id="net"></strong></span></div></article><aside class="side"><div class="metric"><span class="label">Cash position</span><strong id="cash"></strong><span class="meta">Across tracked RUB accounts</span></div><div class="metric"><span class="label">Review desk</span><strong id="review"></strong><span class="meta">Need your input</span></div></aside></section><section class="section"><div class="section-head"><h2>Where it went</h2><button id="clearCategory" hidden>Clear filter</button></div><div id="categories" class="category-grid"></div></section><section class="section"><div class="section-head"><h2 id="activityTitle">Recent activity</h2><span id="matching" class="meta"></span></div><div id="transactions" class="txs"></div><p id="status" class="status" aria-live="polite"></p></section></div></div></main>
<script type="module">
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],money=new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0});let state,id=0;const pending=new Map();const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function render(s){if(!s?.categories)return;state=s;$('#loading').hidden=true;$('#content').hidden=false;$('#period').textContent=s.periodLabel;$('#spent').textContent=money.format(s.outflow);$('#income').textContent=money.format(s.inflow);$('#net').textContent=money.format(s.net);$('#net').className=s.net>=0?'positive':'';$('#cash').textContent=s.cashPosition==null?'—':money.format(s.cashPosition);$('#review').textContent=s.reviewCount;$('#review').className=s.reviewCount?'warning':'';all('[data-period]').forEach(b=>b.classList.toggle('active',b.dataset.period===s.period));$('#accounts').innerHTML=`<button data-account="" class="${s.selectedAccountId?'':'active'}">All accounts</button>`+s.accounts.map(a=>`<button data-account="${esc(a.id)}" class="${a.id===s.selectedAccountId?'active':''}">${esc(a.display_name||a.provider||a.masked_identifier||'Account')}</button>`).join('');const max=Math.max(...s.categories.map(x=>x.spent),1);$('#categories').innerHTML=s.categories.map(c=>`<button class="category ${c.category===s.selectedCategory?'active':''}" data-category="${esc(c.category)}"><span class="category-top"><span>${esc(c.category)}</span><strong>${money.format(c.spent)}</strong></span><span class="bar"><span style="width:${c.spent/max*100}%"></span></span></button>`).join('')||'<div class="empty">No spending in this period.</div>';$('#clearCategory').hidden=!s.selectedCategory;$('#activityTitle').textContent=s.selectedCategory?`${s.selectedCategory} activity`:'Recent activity';$('#matching').textContent=`${s.matchingTransactionCount} matching`;$('#transactions').innerHTML=s.transactions.map(t=>{const out=t.direction==='out';const dt=t.operation_datetime||t.posting_datetime;return `<div class="tx"><span class="icon">${out?'↗':'↙'}</span><div class="copy"><p class="name">${esc(t.merchant_normalized||t.description_raw||'Transaction')}</p><p class="meta">${esc(t.category||'Uncategorized')}${dt?' · '+new Date(dt).toLocaleDateString('en-GB'):''}${t.needs_human_review?' · review':''}</p></div><span class="sum ${out?'':'positive'}">${out?'−':'+'}${money.format(Math.abs(t.amount))}</span></div>`}).join('')||'<div class="empty">No matching transactions.</div>';bind()};function rpc(method,params){return new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id:n,method,params},'*')})}function notify(method,params){parent.postMessage({jsonrpc:'2.0',method,params},'*')}addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const m=e.data;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent??m.params)});const ready=rpc('ui/initialize',{appInfo:{name:'money-keeper-widget',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>notify('ui/notifications/initialized',{}));async function refresh(change){all('button').forEach(b=>b.disabled=true);$('#status').textContent='Refreshing Money Keeper…';try{await ready;const args={period:state.period,accountId:state.selectedAccountId||undefined,category:state.selectedCategory||undefined,...change};const r=await rpc('tools/call',{name:'get_finance_overview',arguments:args});render(r?.structuredContent??r);$('#status').textContent='Updated from normalized bank statements.'}catch(e){console.error(e);$('#status').textContent='Could not refresh the data.'}finally{all('button').forEach(b=>b.disabled=false)}}function bind(){all('[data-account]').forEach(b=>b.onclick=()=>refresh({accountId:b.dataset.account||undefined,category:undefined}));all('[data-category]').forEach(b=>b.onclick=()=>refresh({category:b.dataset.category}));}all('[data-period]').forEach(b=>b.onclick=()=>refresh({period:b.dataset.period,category:undefined}));$('#clearCategory').onclick=()=>refresh({category:undefined});
</script></body></html>
