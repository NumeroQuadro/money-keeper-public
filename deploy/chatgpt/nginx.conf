location = /money-keeper/healthz {
    proxy_pass http://127.0.0.1:2097/healthz;
    proxy_set_header Host $host;
}

location = /money-keeper/.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:2097/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
}

location /money-keeper/mcp {
    proxy_pass http://127.0.0.1:2097/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}
